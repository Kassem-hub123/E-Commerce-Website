<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin &mdash; Categories</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="shop-name" href="/" data-shop-name>Shop</a>
      <nav>
        <a href="/admin.html">Products</a>
        <a href="/categories.html" aria-current="page">Categories</a>
        <a href="/orders.html">Orders</a>
        <button class="link" id="logout" type="button" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="login" id="login" hidden>
      <h1>Admin login</h1>
      <form id="login-form">
        <label>
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <p class="note" id="login-note" role="status"></p>
      </form>
    </section>

    <div class="admin" id="dashboard" hidden>
      <section class="panel">
        <h1>Add a category</h1>
        <form id="category-form">
          <label>
            <span>Name</span>
            <input name="name" type="text" placeholder="Bags" required>
          </label>
          <button type="submit">Add</button>
          <p class="note" id="category-note" role="status"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Categories</h2>
        <div id="category-list"></div>
      </section>
    </div>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/categories.js"></script>
</body>
</html>
